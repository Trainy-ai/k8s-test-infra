#
# AMD Instinct MI355X, 8 GPUs, SPX/NPS1, ROCm 7.2.1.
#
# SYNTHETIC UNTIL REPLACED BY A CAPTURE. Identity and topology follow the
# Wave 0 spike (MEP-1001): the BDFs, PCI ids, KFD ids and render minors that
# the real amd-smi 26.2.2 CLI and rocm/k8s-device-plugin accepted. Every
# measured value (temperatures, power, firmware, VBIOS, serials, limits) is a
# plausible placeholder. Replace this file with one generated from a
# tools/amd-capture/ tarball of a real MI355X node before writing any golden
# contract test against it.
#
# Schema: pkg/gpu/mockamdsmi/profile (types.go documents every field).
# gpu_defaults is merged under each gpus entry; xgmi_full_mesh links every
# GPU pair.

version: 1
name: mi355x-8gpu
source:
  kind: synthetic
  note: Wave 0 spike shapes; measured values are placeholders pending capture.

node:
  software:
    rocm_version: 7.2.1
    amdsmi_lib_version: 26.2.2
    rocm_smi_lib_version: 7.8.0
  driver:
    initstate: live
    version: 6.14.14
  kfd:
    device: char_device
  host:
    hypervisor: false
    numa_nodes: 2

xgmi_full_mesh:
  weight: 15
  min_bandwidth_mbps: 0
  max_bandwidth_mbps: 64000

gpu_defaults:
